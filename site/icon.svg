<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Saw, grime pass: rust speckle, scratched blade, blood-warm glow -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0d0d"/>
      <stop offset="55%" stop-color="#200a0e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#b8362a"/>
      <stop offset="38%" stop-color="#a8871f"/>
      <stop offset="70%" stop-color="#6e5410"/>
      <stop offset="100%" stop-color="#7a4f8f"/>
    </linearGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"
                    seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="speck">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4"
                    seed="31" result="n2"/>
      <feColorMatrix in="n2" type="matrix"
        values="0 0 0 0 0.55  0 0 0 0 0.28  0 0 0 0 0.10  0 0 0 0.9 -0.42" result="rust"/>
      <feComposite in="rust" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="wob">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2"
                    seed="3" result="n3"/>
      <feDisplacementMap in="SourceGraphic" in2="n3" scale="14"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#050508"/>
  <circle cx="256" cy="256" r="242" fill="url(#glow)"/>

  <!-- hand-cut blade ring: rough circle, not perfect -->
  <g filter="url(#wob)">
    <circle cx="256" cy="256" r="178" fill="none" stroke="url(#blade)"
            stroke-width="11"/>
  </g>

  <!-- teeth: irregular lengths, slight wobble -->
  <g stroke="url(#blade)" stroke-width="9" filter="url(#rough)">
    <path d="M256 52 L261 24"/>
    <path d="M296 57 L310 30"/>
    <path d="M336 70 L356 45"/>
    <path d="M372 91 L398 70"/>
    <path d="M403 121 L433 105"/>
    <path d="M427 157 L460 145"/>
    <path d="M443 196 L478 190"/>
    <path d="M451 237 L486 236"/>
    <path d="M451 280 L486 284"/>
    <path d="M443 322 L477 331"/>
    <path d="M427 361 L459 374"/>
    <path d="M403 397 L430 414"/>
    <path d="M372 427 L394 448"/>
    <path d="M336 448 L353 471"/>
    <path d="M296 461 L309 486"/>
    <path d="M256 466 L261 494"/>
    <path d="M216 461 L203 486"/>
    <path d="M176 448 L159 471"/>
    <path d="M140 427 L118 448"/>
    <path d="M109 397 L82 414"/>
    <path d="M85 361 L53 374"/>
    <path d="M69 322 L35 331"/>
    <path d="M61 280 L26 284"/>
    <path d="M61 237 L26 236"/>
    <path d="M69 196 L34 190"/>
    <path d="M85 157 L52 145"/>
    <path d="M109 121 L79 105"/>
    <path d="M140 91 L114 70"/>
    <path d="M176 70 L156 45"/>
    <path d="M216 57 L202 30"/>
  </g>

  <!-- rust and grime layered on the ring -->
  <g filter="url(#speck)" opacity="0.85">
    <circle cx="256" cy="256" r="182" fill="none" stroke="#000" stroke-width="16"/>
  </g>
  <g filter="url(#speck)" opacity="0.55">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#000" stroke-width="26"/>
  </g>

  <!-- scratch marks across the blade -->
  <g stroke="#0a0a10" stroke-width="2.5" opacity="0.8" filter="url(#rough)">
    <path d="M110 190 L392 330"/>
    <path d="M150 110 L360 400"/>
    <path d="M96 280 L420 226"/>
  </g>

  <!-- circuit traces, solder nodes -->
  <g stroke="#161b26" stroke-width="3.2" fill="none">
    <path d="M256 256 L 256 132"/>
    <path d="M256 256 L 366 202"/>
    <path d="M256 256 L 338 354"/>
    <path d="M256 256 L 162 338"/>
    <path d="M256 256 L 150 192"/>
  </g>
  <g fill="#93a1b3" stroke="#0a0a10" stroke-width="1.4">
    <circle cx="256" cy="132" r="7"/>
    <circle cx="366" cy="202" r="7"/>
    <circle cx="338" cy="354" r="7"/>
    <circle cx="162" cy="338" r="7"/>
    <circle cx="150" cy="192" r="7"/>
  </g>

  <!-- heart-node: rough-edged core -->
  <g filter="url(#rough)">
    <circle cx="256" cy="256" r="53" fill="#0a0a12" stroke="#e04a3a"
            stroke-width="6"/>
  </g>
  <circle cx="256" cy="256" r="30" fill="none" stroke="#8a6c1a"
          stroke-width="2" opacity="0.75"/>
  <circle cx="256" cy="256" r="17" fill="#e04a3a"/>
  <circle cx="250" cy="250" r="5" fill="#ff8a75" opacity="0.85"/>

  <text x="256" y="472" text-anchor="middle" fill="#8f9fb0"
        font-family="Menlo, monospace" font-size="30" letter-spacing="10"
        opacity="0.9">$SAW</text>
</svg>